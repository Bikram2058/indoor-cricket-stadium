<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .payment-page {
            background: #0d2818;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .payment-card {
            background: #14331f;
            padding: 45px 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        .success-icon {
            width: 80px;
            height: 80px;
            line-height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #64dd24;
            color: #0d2818;
            font-size: 44px;
            font-weight: bold;
        }
        .payment-card h1 { color: #fff; margin: 0 0 12px; }
        .payment-card p { color: #cfe8d5; margin: 6px 0; }
        .payment-card .main-btn {
            display: inline-block;
            margin: 18px 8px 0;
            padding: 12px 22px;
            background: #64dd24;
            color: #0d2818;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body class="payment-page">
    <div class="payment-card">
        <div class="success-icon">&#10003;</div>
        <h1>Payment Successful!</h1>
        <p>Your payment has been completed successfully.</p>
        <p>Your cricket lane booking is confirmed.</p>
        {% if booking_code %}
        <p>Your booking code: <strong>{{ booking_code }}</strong></p>
        {% endif %}
        <a href="/my-bookings" class="main-btn">View My Bookings</a>
        <a href="/" class="main-btn">Back to Home</a>
    </div>
</body>
</html>
