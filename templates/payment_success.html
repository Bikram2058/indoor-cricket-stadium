<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <style>
        body { margin:0; font-family:Arial,sans-serif; min-height:100vh;
            display:flex; justify-content:center; align-items:center;
            background:linear-gradient(135deg,#071707,#0d3b17,#071707); color:#fff; }
        .reset-card { background:rgba(7,23,7,0.9); border:2px solid #64dd24;
            border-radius:16px; padding:40px; width:340px; text-align:center;
            box-shadow:0 0 30px rgba(100,221,36,0.45); }
        .emoji { font-size:60px; margin-bottom:10px; }
        h2 { color:#64dd24; margin:0 0 10px; }
        p.desc { color:#cfcfcf; font-size:14px; margin-bottom:18px; }
        input { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:none; box-sizing:border-box; }
        button { width:100%; padding:12px; margin-top:12px; background:#64dd24; color:#071707;
            font-weight:bold; font-size:15px; border:none; border-radius:8px; cursor:pointer; }
        button:hover { background:#7ff03a; }
        a { color:#64dd24; text-decoration:none; }
        .success-message { color:#64dd24; }
    </style>
</head>
<body>

<div class="reset-card">
    {% if message %}
        <div class="emoji">📧✅</div>
    {% else %}
        <div class="emoji">😟</div>
    {% endif %}

    <h2>Forgot Password</h2>
    <p class="desc">Enter your email and we'll send you a reset link.</p>

    {% if message %}
    <p class="success-message">{{ message }}</p>
    {% endif %}

    <form method="POST" action="/forgot-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="email" name="email" placeholder="Email Address" required>
        <button type="submit">Send Reset Link</button>
    </form>

    <p><a href="/login">Back to Login</a></p>
</div>

</body>
</html>
