<!DOCTYPE html>
<html>
<head>
    <title>Tournament</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="topbar">

    <div class="logo">
        🏏 INDOOR <span>CRICKET CENTRE</span>
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/booking">Booking</a>
        <a href="/membership">Membership</a>
        <a href="/shop">Shop</a>
        <a href="/contact">Contact</a>
        <a href="/login">Login</a>
        <a class="register-btn" href="/register">Register</a>
    </nav>

</header>

<section class="tournament-section">

    <div class="tournament-box">

        <h2>Weekend Cricket Tournament</h2>

        {% if success %}
        <p class="success-message">Tournament registration submitted successfully!</p>
        {% endif %}

        <form method="POST" action="/tournament">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <input type="text" name="team_name" placeholder="Team Name" maxlength="40" required>

            <input type="text" name="captain_name" placeholder="Captain Name" maxlength="50" pattern="[A-Za-z ]+" title="Letters and spaces only" required>

           <input type="tel" name="phone" placeholder="Phone Number" inputmode="numeric" pattern="[0-9]{8,15}" title="Enter 8 to 15 digits" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>

            <input type="number" name="players" placeholder="Number of Players" min="1" max="15" required>

            <input type="date" name="tournament_date" required>

            <select name="tournament_type" required>
                <option>Select Tournament Type</option>
                <option>T20</option>
                <option>One Day</option>
                <option>Knockout</option>
            </select>

            <select name="entry_fee" required>
                <option>Entry Fee</option>
                <option>$100</option>
                <option>$200</option>
                <option>$300</option>
            </select>

            <button type="submit">Join Tournament</button>

        </form>

    </div>

<div class="prize-box">

    <h2>Prize Pool</h2>

    <div class="prize-card first">
        🥇 1st Prize - $3000
    </div>

    <div class="prize-card second">
        🥈 2nd Prize - $1500
    </div>

    <div class="prize-card third">
        🥉 3rd Prize - $700
    </div>

</div>

</section>

</body>
</html>
