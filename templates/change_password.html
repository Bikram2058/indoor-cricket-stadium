<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password - Indoor Cricket Centre</title>

    <style>
        body {
            background: #071707;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .password-container {
            max-width: 500px;
            margin: 80px auto;
            padding: 35px;
            background: #102b10;
            border: 1px solid #64dd24;
            border-radius: 12px;
        }

        h1 {
            color: #64dd24;
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            background: #64dd24;
            color: #071707;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4caf20;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #64dd24;
            text-decoration: none;
        }

        .error {
            color: #ff7777;
            text-align: center;
        }

        .success {
            color: #64dd24;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="password-container">

        <h1>Change Password</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if success %}
            <p class="success">{{ success }}</p>
        {% endif %}

        <form method="POST" action="/change-password">

            <!-- CSRF protection -->
            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <label>Current Password</label>
            <input type="password"
                   name="current_password"
                   autocomplete="current-password"
                   required>

            <label>New Password</label>
            <input type="password"
                   name="new_password"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <label>Confirm New Password</label>
            <input type="password"
                   name="confirm_password"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <button type="submit">
                Update Password
            </button>

        </form>

        <a href="/dashboard" class="back-btn">
            Back to Dashboard
        </a>

    </div>

</body>
</html>
