<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; font-family:'Segoe UI',Arial,sans-serif; min-height:100vh;
            display:flex; justify-content:center; align-items:center;
            background:radial-gradient(circle at 50% 30%, #0f3d1a, #071707 70%); color:#e9f5e9; }
        .card { background:rgba(10,26,12,0.92); border:1px solid rgba(100,221,36,0.5);
            border-radius:18px; padding:44px 38px; width:360px; text-align:center;
            box-shadow:0 10px 40px rgba(0,0,0,0.6), 0 0 25px rgba(100,221,36,0.15); }
        .brand { font-size:15px; letter-spacing:1px; margin-bottom:26px; font-weight:600; }
        .brand span { color:#64dd24; }
        h2 { margin:0 0 20px; font-size:24px; color:#fff; }
        input { width:100%; padding:13px 14px; margin:8px 0; border-radius:10px;
            border:1px solid #2c4a2c; background:#0c1f0e; color:#fff; font-size:14px; }
        input:focus { outline:none; border-color:#64dd24; }
        button { width:100%; padding:13px; margin-top:14px; background:#64dd24; color:#06230a;
            font-weight:700; font-size:15px; border:none; border-radius:10px; cursor:pointer; transition:background .2s; }
        button:hover { background:#78ef37; }
        .link { display:inline-block; margin-top:18px; color:#64dd24; text-decoration:none; font-size:14px; }
        .link:hover { text-decoration:underline; }
        .error-message { color:#ff8585; background:rgba(255,80,80,0.1); padding:10px; border-radius:8px; font-size:14px; }
        .success-message { color:#64dd24; background:rgba(100,221,36,0.1); padding:10px; border-radius:8px; font-size:14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">🏏 INDOOR <span>CRICKET CENTRE</span></div>
        <h2>Reset Password</h2>

        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}

        {% if success %}
        <p class="success-message">{{ success }}</p>
        <a class="link" href="/login">Go to Login →</a>
        {% endif %}

        {% if token and not success %}
        <form method="POST" action="/reset-password/{{ token }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="password" name="new_password" placeholder="New Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
            <button type="submit">Reset Password</button>
        </form>
        {% endif %}
    </div>
</body>
</html>
